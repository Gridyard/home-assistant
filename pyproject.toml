# Lint rules follow https://github.com/ludeeus/integration_blueprint/blob/main/.ruff.toml

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "ARG001", # Home Assistant calls setup functions and flow steps with a fixed signature
    "ARG002",
    "ARG004",
    "FBT001", # Home Assistant passes booleans positionally (update install: backup)
    "COM812", # incompatible with the formatter
    "CPY001", # the license is in LICENSE, not in file headers
    "D203",   # incompatible with the formatter
    "D213",   # summary on the first line, as in Home Assistant Core
    "ISC001", # incompatible with the formatter
    "TC001",  # Home Assistant Core ignores TC001 to TC003
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "PLR2004", # expected values in tests
    "S101",    # pytest uses assert
]

[tool.ruff.lint.isort]
# The library on PyPI, not custom_components/gridyard.
known-third-party = ["gridyard"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
